# EXAMPLE ONLY. Copy to secrets.toml locally, or paste into Streamlit Cloud Secrets.
# Never commit real passwords or database credentials.

# For a laptop workshop only, uncomment the following:
# REQUIRE_DURABLE_STORAGE = false

# For online collection, use an external PostgreSQL connection with TLS.
# DATABASE_URL = "postgresql://USERNAME:PASSWORD@HOST:5432/DATABASE?sslmode=require"
REQUIRE_DURABLE_STORAGE = true

# Configure a strong unique facilitator password (or its SHA256 hash).
# ADMIN_PASSWORD = "choose-a-strong-unique-password"
# ADMIN_PASSWORD_SHA256 = "paste-the-hash-here"

# Optional password to restrict survey participation.
# SURVEY_PASSWORD = "choose-a-separate-survey-password"
# SURVEY_PASSWORD_SHA256 = "paste-the-hash-here"
